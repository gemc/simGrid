name: Deploy CLAS12 Grid Images

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clas12-grid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          # Restore the missing COPY sources before enabling these images.
          - test
          # - devel
          # - production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ matrix.variant }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/Dockerfile-almalinux94-${{ matrix.variant }}
          platforms: linux/amd64
          pull: true
          no-cache: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
